# Refreshes app/public/jobs.json every 6 hours for static deployments
# (the Supabase pg_cron job does the same for the database-backed board).
name: Refresh jobs
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch jobs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: node supabase/scripts/fetch-jobs.mjs app/public/jobs.json
      - name: Commit if changed
        run: |
          git config user.name "dataladder-bot"
          git config user.email "dataladder-bot@users.noreply.github.com"
          git add app/public/jobs.json
          git diff --cached --quiet || git commit -m "chore: refresh job listings"
          git push
